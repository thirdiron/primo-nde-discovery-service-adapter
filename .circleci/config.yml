version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.3.2
  aws-cli: circleci/aws-cli@5.4.1

settings: &settings
  shell: /bin/bash --login
  docker:
    - image: cimg/node:20.18.3-browsers
  working_directory: ~/project

package-cache: &package-cache
  key: package-cache-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}

commands:
  deploy-to-s3:
    description: >
      Upload the build so that a stale remoteEntry.js (still cached by CloudFront or a browser) can
      always find its chunks: hashed files go up first, remoteEntry.js last, and files from earlier
      builds are only removed once they are older than the retention window.
    parameters:
      target:
        type: string
        description: S3 prefix under primo-nde/ (dev-test, staging, production)
      retention-days:
        type: integer
        default: 7
    steps:
      - aws-cli/install
      - run:
          name: Upload hashed chunks and static assets
          command: |
            aws s3 sync dist/THIRD-IRON-LIBKEY s3://$AWS_BUCKET/primo-nde/<< parameters.target >> \
              --cache-control "max-age=31536000,public" \
              --exclude "remoteEntry.js" \
              --exclude "*.html" \
              --exclude "*.json"
      - run:
          name: Upload HTML and JSON files with no-cache
          command: |
            aws s3 sync dist/THIRD-IRON-LIBKEY s3://$AWS_BUCKET/primo-nde/<< parameters.target >> \
              --cache-control "no-cache,no-store,must-revalidate" \
              --exclude "*" \
              --include "*.html" \
              --include "*.json"
      - run:
          name: Upload remoteEntry.js
          command: |
            aws s3 cp dist/THIRD-IRON-LIBKEY/remoteEntry.js \
              s3://$AWS_BUCKET/primo-nde/<< parameters.target >>/remoteEntry.js \
              --cache-control "no-cache"
      - run:
          name: Remove hashed files from builds older than << parameters.retention-days >> days
          command: |
            prefix="primo-nde/<< parameters.target >>/"
            cutoff=$(date -u -d '<< parameters.retention-days >> days ago' +%Y-%m-%dT%H:%M:%S)
            ls dist/THIRD-IRON-LIBKEY | sed "s|^|$prefix|" > /tmp/current-build-keys
            aws s3api list-objects-v2 --bucket "$AWS_BUCKET" --prefix "$prefix" --delimiter / \
              --query 'Contents[].[Key,LastModified]' --output text \
              | awk -v cutoff="$cutoff" '$2 < cutoff { print $1 }' \
              | grep -E "^${prefix}[^/]+\.[0-9a-f]{16}\.(js|css)$" \
              | grep -vxF -f /tmp/current-build-keys \
              | while read -r key; do aws s3 rm "s3://$AWS_BUCKET/$key"; done

jobs:
  build-and-test:
    <<: *settings
    steps:
      - checkout
      - restore_cache:
          <<: *package-cache
      - run:
          name: Install project dependencies
          command: |
            npm ci --loglevel verbose
      - browser-tools/install_chrome
      - browser-tools/install_chromedriver
      - run:
          name: Check browser tools install
          command: |
            google-chrome --version
            chromedriver --version
      - save_cache:
          <<: *package-cache
          paths:
            - node_modules
      - run:
          name: Run automated tests
          command: |
            npm run test:ci
      - persist_to_workspace:
          root: ~/
          paths:
            - 'project'

  deploy-to-dev-test:
    <<: *settings
    steps:
      - checkout
      - restore_cache:
          <<: *package-cache
      - run:
          name: Install project dependencies
          command: |
            npm ci --loglevel verbose
      - run:
          name: Build project
          command: |
            npm run build
      - deploy-to-s3:
          target: dev-test

  deploy-to-staging:
    <<: *settings
    steps:
      - checkout
      - restore_cache:
          <<: *package-cache
      - run:
          name: Install project dependencies
          command: |
            npm ci --loglevel verbose
      - run:
          name: Build project
          command: |
            npm run build
      - deploy-to-s3:
          target: staging

  deploy-to-production:
    <<: *settings
    steps:
      - checkout
      - restore_cache:
          <<: *package-cache
      - run:
          name: Install project dependencies
          command: |
            npm ci --loglevel verbose
      - run:
          name: Build project
          command: |
            npm run build
      - deploy-to-s3:
          target: production

  renogen:
    docker:
      - image: cimg/node:18.16.1
    steps:
      - add_ssh_keys
      - run:
          name: create ssh directory
          command: mkdir ~/.ssh/
      - run:
          name: add github.com to known_hosts
          command: ssh-keyscan github.com >> ~/.ssh/known_hosts
      - run:
          name: Clone release_notes_generator repository
          command: git clone git@github.com:thirdiron/release_notes_generator.git .
      - run:
          name: Install release_notes_generator dependencies
          command: npm ci
      - run:
          name: Build release_notes_generator
          command: npm run build
      - run:
          name: Generate release notes
          command: DEPLOY_BRANCH_NAME='main' npm run start -- primo-nde-discovery-service-adapter

workflows:
  build-test-deploy:
    jobs:
      # - deploy-hotfix:
      #     requires:
      #       - build-and-test
      #     filters:
      #       branches:
      #         only: /hotfix\/.*/
      # - deploy-feature:
      #     requires:
      #       - build-and-test
      #     filters:
      #       branches:
      #         only: /feature\/.*/
      - build-and-test
      - deploy-to-dev-test:
          requires:
            - build-and-test
          filters:
            branches:
              only: /feature\/.*/
      - deploy-to-staging:
          requires:
            - build-and-test
          filters:
            branches:
              only: develop
      - deploy-to-production:
          requires:
            - build-and-test
          filters:
            branches:
              only: main
      - renogen:
          requires:
            - build-and-test
          filters:
            branches:
              only:
                - develop
